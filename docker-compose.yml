version: "4"
services:
  mqtt:
    image: eclipse-mosquitto
    volumes:
      - mosquitto_conf:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - mqttnet
    ports:
      - "9001:9001"
      - "1883:1883"



  mongodb:
    image: mongo:7.0.5
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: flossyDB
    volumes:
      - ./data:/data/db
volumes:
  mosquitto_conf:
  mosquitto_data:
  mosquitto_log:
networks:
  mqttnet:
    driver: bridge



