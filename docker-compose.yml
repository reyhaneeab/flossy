services:
  mqtt:
    image: eclipse-mosquitto
    volumes:
      - mosquitto_conf:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - mqttnet
    ports:
      - "9001:9001"
      - "1883:1883"

  mongodb1:
    container_name: mongodb1
    image: mongo:7.0.5
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: flossyDB
    volumes:
      - ./data/mongo1:/data/db
    networks:
      - mqttnet

  mongodb2:
    container_name: mongodb2
    image: mongo:7.0.5
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: flossyDB
    volumes:
      - ./data/mongo2:/data/db
    networks:
      - mqttnet

  mongodb3:
    container_name: mongodb3
    image: mongo:7.0.5
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_DATABASE: flossyDB
    volumes:
      - ./data/mongo3:/data/db
    networks:
      - mqttnet

  mongo-init:
    image: mongo:7.0.5
    command: >
      bash -c '
        echo "Waiting for MongoDB instances to start..."
        sleep 10
      
        echo "Setting up replica set..."
        mongosh --host mongodb1:27017 --eval "
          rs.initiate({
            _id: \"rs0\",
            members: [
              {_id: 0, host: \"mongodb1:27017\", priority: 2},
              {_id: 1, host: \"mongodb2:27017\", priority: 0},
              {_id: 2, host: \"mongodb3:27017\", priority: 0}
            ]
          })
        "
      '
    depends_on:
      - mongodb1
      - mongodb2
      - mongodb3
    networks:
      - mqttnet

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - mqttnet

volumes:
  mosquitto_conf:
  mosquitto_data:
  mosquitto_log:

networks:
  mqttnet:
    driver: bridge