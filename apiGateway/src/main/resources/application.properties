# Application name
spring.application.name=api-gateway

# Spring Cloud Gateway configuration

# Define static routes for the services
spring.cloud.gateway.routes[0].id=calendar-service
spring.cloud.gateway.routes[0].uri=http://localhost:8083
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/calendar/**

spring.cloud.gateway.routes[1].id=dentist-service
spring.cloud.gateway.routes[1].uri=http://localhost:8084
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/dentist/**

spring.cloud.gateway.routes[2].id=appointment-service
spring.cloud.gateway.routes[2].uri=http://localhost:8088
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/appointment/**