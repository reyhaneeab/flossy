# Application name for Eureka server
spring.application.name=api-gateway

# Eureka client configuration

# Register with Eureka server as a client application
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Register with Eureka server using IP address instead of hostname
eureka.instance.prefer-ip-address=true

# Spring Cloud Gateway configuration

# Enable discovery locator for routing to services
spring.cloud.gateway.discovery.locator.enabled=true
# Convert service id to lowercase before registering routes
spring.cloud.gateway.discovery.locator.lower-case-service-id=true 
