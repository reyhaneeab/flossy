
default:
  image: ubuntu:22.04
  tags:
    - docker

stages:
  - setup
  - backend_build
  - backend_test
  - deploy

variables:
  MAVEN_HOME: "/opt/maven"
  JAVA_HOME: "/usr/lib/jvm/java-21-openjdk-amd64"
  PATH: "$PATH:$MAVEN_HOME/bin"

before_script:
  # Install dependencies and set up the environment
  - export "PATH=${CARGO_HOME}/bin:$PATH"
  - echo "Setting up the environment..."
  - apt-get update && apt-get install -y openjdk-21-jdk maven docker.io docker-compose
  - java -version
  - mvn -version
  - docker -v
  - docker-compose -v

backend_build_job:
  stage: backend_build
  script:
    - echo "Building the backend with Maven..."
    - mvn clean install
    - echo "Backend build complete."

backend_test_job:
  stage: backend_test
  script:
    - echo "Starting services for testing..."
    - docker-compose up -d
    - echo "Running integration tests..."
    - mvn verify
    - echo "Tests completed successfully."
    - echo "Stopping services after testing..."
    - docker-compose down

deploy_job:
  stage: deploy
  script:
    - echo "Deploying the application..."
    - docker-compose up -d
    - echo "Deployment completed successfully."
