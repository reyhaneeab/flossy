stages:
  - build

build-job:
  stage: build
  script:
    # Install Maven
    - echo "Installing Maven..."
    - wget https://downloads.apache.org/maven/maven-3/3.8.7/binaries/apache-maven-3.8.7-bin.tar.gz
    - tar -xzf apache-maven-3.8.7-bin.tar.gz
    - export MAVEN_HOME=$(pwd)/apache-maven-3.8.7
    - export PATH=$MAVEN_HOME/bin:$PATH
    - mvn --version  # Verify Maven installation

    # Compile the code
    - echo "Compiling the code..."
    - mvn clean compile
    - echo "Compile complete."

  only:
    - 15-add-basic-ci-cd-stages-to-the-project
