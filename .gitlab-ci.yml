image: ubuntu:22.04

stages:
   - build
   - deploy

build_job:
   stage: build
   script:
     - echo "Building the project..."
     - apt-get update && apt-get install -y maven
     - mvn clean install
     - echo "Build complete."
     - echo "Compiling the project..."
     - mvn compile
deploy_job:
   stage: deploy
   script:
     - echo "Deploying the project..."
     - echo "Deploy complete."