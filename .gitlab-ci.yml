default:
  image: ubuntu:22.04
  tags:
    - docker

stages:
  - setup
  - backend_build
  - backend_test
  - deploy

variables:
  MAVEN_HOME: "/opt/maven"
  JAVA_HOME: "/usr/lib/jvm/java-21-openjdk-amd64"

before_script:
  - echo "Setting up the environment..."
  - apt-get update && apt-get install -y openjdk-21-jdk maven
  - export "PATH=$MAVEN_HOME/bin:$PATH"
  - java -version
  - mvn -version

user_service_build:
  stage: backend_build
  script:
    - echo "Building User Service..."
    - mvn clean install -pl user-service -DskipTests
    - echo "User Service build complete."

user_service_test:
  stage: backend_test
  services:
    - name: mongo:7.0.5
      alias: mongo
  variables:
    MONGODB_URI: "mongodb://mongo:27017/serverTestDB"
  script:
    - echo "Running tests for User Service..."
    - mvn test -pl user-service
    - echo "User Service tests completed."    

deploy_job:
  stage: deploy
  script:
    - echo "Deploying the application..."
    - echo "Deployment completed successfully."
