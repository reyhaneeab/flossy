default:
  image: ubuntu:22.04
  tags:
    - docker

stages:
  - setup
  - backend_build
  - backend_test
  - deploy

variables:
  MAVEN_HOME: "/opt/maven"
  JAVA_HOME: "/usr/lib/jvm/java-21-openjdk-amd64"

before_script:
  # Install dependencies and set up the environment
  - echo "Setting up the environment..."
  - apt-get update && apt-get install -y openjdk-21-jdk maven docker.io docker-compose
  - service docker start  # Start Docker service
  - chmod 666 /var/run/docker.sock  # Ensure proper permissions for Docker
  - export "PATH=$MAVEN_HOME/bin:$PATH"
  - java -version
  - mvn -version
  - docker -v
  - docker-compose -v
  - docker ps  # Verify Docker is running

backend_build_job:
  stage: backend_build
  script:
    - echo "Building the backend with Maven..."
    - mvn clean install
    - echo "Backend build complete."

backend_test_job:
  stage: backend_test
  tags:
    - docker
  services:
    - name: mongo:7.0.5
      alias: mongo
    - name: eclipse-mosquitto:latest
      alias: mqtt
  variables:
    MONGODB_URI: "mongodb://mongo:27017/serverTestDB"
  script:
    - echo "Starting backend tests..."
    - mvn test
    - echo "Running integration tests..."
    - mvn failsafe:integration-test
    - mvn failsafe:verify
    - echo "Tests completed successfully."

deploy_job:
  stage: deploy
  script:
    - echo "Deploying the application..."
    - docker-compose up -d
    - echo "Deployment completed successfully."
