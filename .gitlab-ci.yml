image: ubuntu:22.04

stages:
  - setup
  - backend_build
  - backend_run

variables:
  MAVEN_HOME: "/opt/maven"
  JAVA_HOME: "/usr/lib/jvm/java-21-openjdk-amd64"
  PATH: "$PATH:$MAVEN_HOME/bin"

before_script:
  # Install Java, Maven, and Docker
  - echo "Installing Java, Maven, and Docker..."
  - apt-get update && apt-get install -y openjdk-21-jdk maven docker.io
  - java -version
  - mvn -version
  - docker -v

backend_build_job:
  stage: backend_build
  script:
    - echo "Building the backend with Maven..."
    - mvn clean install
    - mvn verify
    - echo "Backend build complete."

backend_run_job:
  stage: backend_run
  script:
    - echo "Running backend services..."
    - docker-compose up -d
    - echo "Backend services started successfully."
