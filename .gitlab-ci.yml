default:
  image: ubuntu:22.04
  tags:
    - docker

stages:
  - setup
  - backend_build
  - backend_test
  - deploy

variables:
  MAVEN_HOME: "/opt/maven"
  JAVA_HOME: "/usr/lib/jvm/java-21-openjdk-amd64"

before_script:
  # Install dependencies and set up the environment
  - echo "Setting up the environment..."
  - apt-get update && apt-get install -y openjdk-21-jdk maven
  - export "PATH=$MAVEN_HOME/bin:$PATH"
  - java -version
  - mvn -version

user-service_build_job:
  stage: backend_build
  script:
    - echo "Building User Service and dependencies..."
    - mvn clean install -pl user-service -am -DskipTests
    - echo "Backend build complete."

appointment-service_build_job:
  stage: backend_build
  script:
    - echo "Building Appointment Service and dependencies..."
    - mvn clean install -pl appointment-service -am -DskipTests
    - echo "Backend build complete."

calendar-service_build_job:
  stage: backend_build
  script:
    - echo "Building  Calendar Service and dependencies..."
    - mvn clean install -pl calendar-service -am -DskipTests
    - echo "Backend build complete."

api-gateway_build_job:
  stage: backend_build
  script:
    - echo "Building API Gateway and dependencies..."
    - mvn clean install -pl api-gateway -am -DskipTests
    - echo "API Gateway build complete."

dentist-service_build_job:
  stage: backend_build
  script:
    - echo "Building Dentist Service and dependencies..."
    - mvn clean install -pl dentist-service -am -DskipTests
