image: maven:4.0.0 eclipse-temurin-21
stages:
   - build
   - deploy

build_job:
   stage: build
   script:
     - echo "Building the project..."
     - mvn clean install
     - echo "Build complete."
     - echo "run serve"
     - mvn compile
deploy_job:
   stage: deploy
   script:
     - echo "Deploying the project..."
     - echo "Deploy complete."