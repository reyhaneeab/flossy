stages:
   - build
   - deploy

build_job:
   stage: build
   script:
     - npm install
     - echo "Building the project..."
     - npm run build
     - echo "Build complete."
     - npm run serve
     - echo "run serve"

deploy_job:
   stage: deploy
   script:
     - echo "Deploying the project..."
     - echo "Deploy complete."