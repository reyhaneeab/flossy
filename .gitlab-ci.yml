stages:
  - build

cache:
  paths:
    - .m2/repository

build-job:
  stage: build
  tags:
    - docker
  script:
    # Install Maven
    - echo "Installing Maven..."
    - wget https://archive.apache.org/dist/maven/maven-3/3.8.7/binaries/apache-maven-3.8.7-bin.tar.gz
    - tar -xzf apache-maven-3.8.7-bin.tar.gz
    - export MAVEN_HOME=$(pwd)/apache-maven-3.8.7
    - export PATH=$MAVEN_HOME/bin:$PATH
    - mvn --version  

    # Compile the code
    - "cd dentist-service"
    - echo "Compiling the code..."
    - mvn clean compile
    - echo "Compile complete."

  except:
    - tags
  
  only:
    - 15-add-basic-ci-cd-stages-to-the-project
